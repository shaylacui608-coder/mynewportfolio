design_quality_checklist:
  - 是否单 hero 真实茶饮产品（1, 偶尔 1-2）？（多产品并列 = ❌, 变成 menu）
  - 是否有真实自然支持元素（植物 / 木 / 石 / 沙 / 水果 / 蔬菜）环绕产品？（缺自然元素 = ❌）
  - 标题是否大字毛笔 / 重 Ming 中文, 占画面 30-50%？（小字 supportive = ❌, 圆体 / 廉价 sans = ❌）
  - 背景是否沉浸自然场景 OR 有意图纹理面？（纯白 / 净色 / 脏底 = ❌）
  - 调色是否暖土 OR 深绿家族？（高饱和促销红 / 荧光 = ❌）
  - 文案语气是否 storytelling（origin / season / craft / 自然源）？（促销叫卖 = ❌）
  - 产品摄影是否真实, 有水珠 / 蒸汽 / 透明度等细节？（3D / 插画 / 塑料感 = ❌）
  - 自然支持元素是否真实摄影？（插画 / 3D 元素 = ❌）
  - 信息密度是否中等, 有呼吸感？（堆 promo 贴纸 = ❌）
  - 是否最多 1 枚红印章, 没有卷草 / 祥云 / 花纹堆砌？
  - 字符是否清晰, 无伪中文 / 乱码？
  - 是否避免 AI 装饰图标 / 假高级金 / 神奇泡泡光？

