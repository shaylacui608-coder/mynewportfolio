design_quality_checklist:
  - 标题是否手写毛笔字（有顿挫 / 飞白 / 风化感）？（印刷 Ming / 圆体 / 卡通字 = ❌）
  - 标题是否占画面 40-60%, 是视觉绝对主导？（标题做小 / supportive = ❌）
  - 菜品是否真实摄影（汤色 / 肉质 / 蒸汽细节可见）？（插画 / 3D / 卡通 = ❌）
  - 菜品占画面是否 25-40%（不超过标题主导）？（菜品 > 50% = ❌）
  - 背景是否 textured 暖色纸面？（纯白 / 净色 / 脏底 / 深色 = ❌）
  - 是否有 watermark pattern overlay（食材 / 地域 / 水波 / heritage 字）？
  - 是否有 4-6 个支撑元素（徽章 + 品牌 + 价签 + vertical 小字 + 印章 + bottom strip）？（≤ 3 = 空荡 = ❌）
  - 调色是否暖基底 + 深字色？（高饱和促销红铺满 = ❌）
  - 是否有混排语言（简中 + 繁中 / 日文 / 英文）？
  - 是否避免中式 ornament 堆砌（单红印章 OK, 卷草 / 祥云 / 花纹 = ❌）？
  - 字符是否清晰可读, 无伪中文 / 伪日文 / 乱码？
  - 整体调性是否街边手写招牌（不是 editorial 精致, 不是 storytelling premium zen）？

