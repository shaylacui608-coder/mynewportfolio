style_name: signboard_typography_food_poster
style_cn: 招牌字形
style_cn_full: 手写招牌字形餐饮海报风（巨大手写毛笔字 + 单 hero 菜品 + textured 纸面 + 街边手写招牌调）
style_type: 餐饮单品海报 / 招牌菜推广 / 限定菜品 KV / 地域美食营销 / 节日餐饮 / 街边手写招牌风格

usage_scenes:
  - 餐饮品牌招牌菜推广（招牌牛肉面 / 招牌酸菜鱼 / 招牌烧鸡 / 招牌粉丝）
  - 日式居酒屋 / 拉面店 / 丼饭单品上市
  - 地域特色美食营销（潮汕 / 兰州 / 武汉 / 长沙 / 川味）
  - 限定时令菜品 KV（冬至 / 节日 / 月限定）
  - 街边连锁餐厅菜品海报
  - 大众点评门头 / 美团商详 / 小红书餐饮封面
  - 餐厅菜单页 hero 海报

mood_keywords:
  - 招牌字形
  - 手写毛笔
  - 巨大主标题
  - 街边招牌
  - 地域美食
  - 真实菜品
  - 暖色textured 纸面
  - 多支撑元素
  - 混排语言（中 + 日 + 英）
  - 椭圆徽章
  - 价签

one_liner: 用巨大手写毛笔 signboard 中文标题（占画面 40-60%, 字 LED）+ 单 hero 真实菜品摄影 + textured 纸面背景（带 watermark 食材线稿 / 古早纹 / 水波）+ 多支撑元素（椭圆徽章 / 品牌 emblem / 价签 / vertical 小字 / 印章）, 构建一种街边手写招牌餐厅菜品海报。

output_ratio_options:
  banner: '4:1'
  poster: '3:4'
  square: '1:1'

style_essence:
  visual_type:
    - typography-led signboard food poster
    - hand-painted brush calligraphy Chinese title as protagonist
    - single hero dish photography supporting the title
    - textured paper background with optional faint watermark pattern
    - multi-supporting-element layout (badges / brand mark / price tag / small copy)
    - mixed-language Chinese + optional Japanese kanji + small English
  not:
    - multi-dish menu array of 3+ equal-weight dishes
    - clean editorial layout with supportive small title
    - product-led layout where title is just a small caption
    - 3D rendered dish / clay food / glossy plastic finish
    - cute cartoon mascot-led poster
    - sparse Japanese minimalist single-frame
    - heritage Chinese ornament-heavy poster (印章 / 卷草 / 祥云 / 花纹 dense)
    - storytelling premium tea-brand zen aesthetic (different from green_natural)

core_visual_logic:
  - 巨大手写毛笔 signboard 中文标题占画面 40-60%, 字 LED 风格（标题是 protagonist, 不是 supporting）
  - 单 hero 真实菜品摄影占画面 25-40%, 在标题下方或交叠
  - 标题字体特征: 手写毛笔感, 笔触有顿挫 / 飞白 / 风化感, 不是干净 Ming, 不是现代圆体
  - 背景永远是 textured 纸面（cream / beige / peach / orange / yellow base）+ optional faint watermark pattern（食材线稿 / 古早纹 / 水波 / 品牌 watermark typography）
  - 必有多支撑元素: 椭圆徽章 + 品牌 emblem + 价签 + vertical 小字 + 印章 + 小 hashtag, 共同烘托招牌感
  - 调色: 暖基底（cream / peach / orange / yellow）+ 深字色（黑 / 深棕 / 暗红）+ 偶尔色 panel（蓝 / 绿 / 红）做对比
  - 混排语言常见: 简中 + 繁中 + 日文 (kanji + hiragana) + small English
  - 街边手写招牌街市感, 不是 editorial 精致感

design_quality_logic:
  design_sense_from:
    - 巨大手写毛笔字本身的"街边招牌"气韵（笔触飞白 / 顿挫 / 风化质感）
    - 真实菜品摄影质感（汤色 / 肉质 / 蔬菜鲜 / 蒸汽）
    - textured 纸面背景（米色 / 桃色 / 米黄 / 暖橙）+ faint watermark pattern 烘托
    - 多支撑元素层级清晰（徽章 / 品牌 / 价签 / 小字各司其职）
    - 暖色基调 + 红黑字色 + 偶尔色 panel 对比的色彩系统
    - 混排语言（中 / 日 / 英）增加正宗 / 异域 / 国际感
    - 街边招牌街市感（不是 editorial 精致, 是热闹烟火气）

  key_design_decisions:
    - 让手写毛笔标题占据画面 40-60%, 成为 protagonist
    - 标题必须有手写顿挫 / 飞白质感, 不能用干净印刷字
    - 用真实菜品摄影, 绝不用 3D / 卡通 / 插画
    - 背景必须 textured 纸面, 绝不纯色或脏底
    - 必有多支撑元素围绕标题, 单标题 + 单菜品的空荡 layout = 失败
    - 暖色基底 + 红黑字, 不用高饱和促销红铺底
    - 混排语言展现正宗感（如日式用 kanji + hiragana, 中式用 简中 + 繁中）

  hierarchy_control:
    - 第一层: 巨大手写毛笔标题（40-60% 画面, 视觉绝对主导）
    - 第二层: 单 hero 真实菜品摄影（25-40% 画面）
    - 第三层: 椭圆徽章 / 价签 / 品牌 emblem
    - 第四层: vertical 小字 / hashtag / 印章 / 小副标语

  layout_intention:
    primary: title_over_dish（标题在上 / 居中, 菜品在下方或居中交叠）
    variant_1: vertical_pillar_title（标题竖排 pillar 在一侧, 菜品在另一侧或下方）
    variant_2: panel_block_title（色块 panel 内放标题, 菜品在 panel 外 / 下）
    variant_3: collage_scatter_with_central_title（多元素散布 + 中央巨字 + 多菜品 cutout）
    rule: 字永远是主角, 菜品是支撑, 多元素围绕不喧宾

  restraint:
    - 不用现代圆体 / 印刷干净 Ming / 卡通字（标题必须手写毛笔感）
    - 不用 3D / 卡通 / 插画菜品（必须真实摄影）
    - 不用纯白电商底 / 纯净色（必须 textured 纸面）
    - 不用高饱和促销红铺满（红字 / 红色 panel 可, 红色铺底不可）
    - 不用 minimalist 空荡 layout（必须有多支撑元素）
    - 不用 ornament 堆砌（单红印章 OK, 卷草 / 祥云 / 花纹堆砌 NO）
    - 不用 elegant editorial small caps（这是街边招牌, 不是精致 editorial）

  theme_form_relationship:
    - 「中式餐厅招牌菜」→ cream 纸 + 黑/深棕/红毛笔字 + 椭圆/印章徽章 + 简中 + 西文 small caps
    - 「日式居酒屋」→ kanji + hiragana 混排 + 水波 / 鱼图 watermark + 蓝/橙色 panel + 红价签
    - 「地域美食」→ 当地建筑/食材线稿 watermark + 地域名 vertical 标签 + 当地特色色（武汉樱花 / 长沙烟火 / 兰州青花碗）
    - 「节日限定」→ 节日大字 + 节日色（冬至红 / 春节金 / 中秋月）+ 节日 motif 椭圆徽章
    - 「限时促销」→ 价签突出 + 时间窗 + 限定徽章, 但维持手写招牌感
    - 「街市风味」→ 食材 cutout 散布 + hashtag 标签 + 暖黄色块 + 手写涂鸦

  avoid_losing_design_sense:
    - 不要把标题字号变小（必须 DOMINANT, 占 40-60%）
    - 不要把字体换成印刷 Ming / 圆体（毁手写招牌感）
    - 不要让菜品占画面 > 50%（毁字 LED 关系）
    - 不要把背景换成纯白电商底（毁街边招牌感）
    - 不要砍掉支撑元素（毁招牌感, 变成空荡 hero）
    - 不要用插画或 3D 代替真实菜品（毁餐饮真实感）
    - 不要用高饱和促销红铺底（变成促销 KV, 不是招牌海报）
    - 不要用 elegant editorial small caps（这是街招, 不是杂志）

  most_valuable_reusable_decision:
    - 「手写毛笔大字 40-60% + 单 hero 真菜品 + textured 纸底 + 多支撑元素」四要素结构
    - 标题做 protagonist 而非 supporting / dominant 的角色（字 LED 而非 product LED）
    - 手写顿挫 / 飞白 / 风化质感作为"街边招牌"的视觉签名
    - 混排语言（中 + 日 + 英）展现地域 / 异域 / 正宗感

theme_transfer_rule:
  principle: >
    主题迁移时必须保留: 巨大手写毛笔 signboard 标题（40-60% 画面）、单 hero 真实菜品摄影
    （25-40% 画面）、textured 纸面背景（带 watermark pattern）、多支撑元素层级（徽章 / 品牌
    emblem / 价签 / vertical 小字 / 印章）、暖色基调 + 深字色色彩系统、混排语言能力。
    新主题元素必须保持手写毛笔字体, 不能换成印刷字; 必须真实菜品摄影, 不能改插画 / 3D;
    必须 textured 纸面, 不能纯白; 必须有多支撑元素, 不能空荡 hero。
  transferable_design_relationships:
    - oversized_handpainted_brush_calligraphy_as_protagonist
    - single_hero_real_dish_photography_as_supporting
    - textured_warm_paper_background_with_watermark_pattern
    - multi_supporting_element_hierarchy
    - warm_base_with_dark_type_color_system
    - mixed_language_typography_capability
    - street_signboard_tone_not_editorial_refined
  replaceable_surface_elements:
    - 具体菜品类型（牛肉面 / 拉面 / 酸菜鱼 / 烧鸡 / 蒸饺 / 海鲜丼 / 牛肉丸）
    - 标题文字（招牌菜名 / 限定名 / 地域特色名）
    - 背景纸色（cream / beige / peach / orange / yellow / kraft）
    - Ghost pattern 内容（食材线稿 / 古早纹 / 水波 / 当地建筑 / 品牌 watermark typography）
    - 调色子分支（中式暖红 / 日式蓝橙 / 地域特色色 / 节日色）
    - 语言混排组合（简 + 繁 / 简 + 日 / 简 + 英 / 简 + 繁 + 日）
    - 支撑徽章内容（地域限定 / 正宗 / 第N代 / 价签 / 时间窗）
  avoid_when_transferring:
    - clean_printed_song_or_modern_sans_typography
    - illustration_or_3d_or_clay_food
    - pure_white_e_commerce_background
    - dominant_high_saturation_promo_red_fill
    - minimalist_empty_hero_layout
    - chinese_traditional_ornament_overload
    - elegant_editorial_small_caps_style
    - storytelling_premium_zen_tone
  object_translation_map:
    new_dish: real photographed single hero dish (bowl / plate / steamer) in believable vessel with natural lighting; preserve product identity if user-provided
    new_signboard_title: oversized hand-painted brush calligraphy with weathered / drybrush / signboard ink character, occupying 40-60% of frame, derived from user-provided title
    new_background: textured paper surface in warm tone (cream / beige / peach / orange / yellow / kraft) with optional faint watermark pattern matched to concept (ingredient line art / regional landmark silhouette / wave illustration / heritage ornament silhouette)
    new_brand_emblem: small circular or rectangular brand mark in a corner — generic monochrome or red, never copy specific named brand from this prompt
    new_supporting_badges: oval or round small badges (origin / signature / season-limited / price / generic concept word) — at least 2-3 around the title
    new_regional_or_japanese_motif: regional landmark line drawing, ingredient silhouette, wave pattern, watermark typography, or oriental motif appropriate to the concept
  must_keep:
    - 手写毛笔标题 40-60% 画面
    - 单 hero 真实菜品 25-40% 画面
    - textured 纸面背景 + watermark pattern
    - 多支撑元素层级（≥4 类装饰）
    - 暖色基调 + 深字色
    - 街边招牌街市感
  must_not_happen:
    - 印刷 Ming / 现代圆体 / 卡通字标题
    - 插画 / 3D 菜品
    - 纯白电商底
    - 标题做小 / supportive
    - 单菜品 > 50% 画面
    - 高饱和促销红铺满
    - 空荡 hero 无支撑元素
    - elegant editorial small caps 调

# NOTE: variant subfields are dumped verbatim into SELECTED VARIANT in the
# assembled prompt. Any concrete Chinese text, brand name, dish name, or
# poster headline embedded here will be copied by the model into the generated
# image as if it were an instruction. Use format descriptions, NOT concrete
# examples. Concrete reference-image mappings live in _meta and the analysis MD.
variants:
  classic_chinese_signboard:
    when_to_use: classic Chinese restaurant signature dish posters, traditional regional cuisine campaigns, heritage / family-recipe storytelling, Chinese chain restaurant menus, hand-made craft narrative
    palette:
      - warm cream or beige paper base
      - dark brown or black for primary brush type
      - red accent for badge / seal / secondary type
      - optional green or blue panel for ribbon / bottom band
    background_treatment: warm cream / beige / peach textured paper with optional faint watermark pattern (ingredient silhouette / heritage architectural line / faint Chinese ornament typography / ink-wash brush watermark); never plain solid
    typography_emphasis: massive heavy black or dark-brown hand-painted brush calligraphy as dominant title, with characteristic drybrush / signboard ink character; small caps English subtitle horizontal at bottom; vertical Chinese small text for product copy or origin claim
    decoration_emphasis: oval or round small concept badges (generic small character oval seal / round signature label), brand emblem with shop name lockup in a corner, optional ribbon banner with cuisine concept, optional red seal or stamp, vertical Chinese sub-copy column, decorative bottom strip with romanization
    information_density: medium-rich

  japanese_izakaya_brush:
    when_to_use: Japanese izakaya / ramen / donburi / udon brand posters, Japanese-Chinese fusion item launches, regional-limited Japanese-style items, restaurant signboard with mixed Chinese-Japanese kanji
    palette:
      - warm cream or beige paper base
      - black or dark-brown for primary brush type
      - blue panel or orange panel for title color block
      - red for badge / wave illustration accent
    background_treatment: textured paper with optional Japanese motif overlay (wave illustration in red brush / kanji watermark typography / faint seafood silhouette / dotted half-tone pattern); often a solid color block (blue / orange) hosts the title
    typography_emphasis: massive heavy hand-painted brush calligraphy mixing Chinese kanji with Japanese hiragana / katakana; characteristic dense signboard ink; secondary small caps English seafood / regional callout
    decoration_emphasis: red oval price badge, regional-limited vertical stamp, brand izakaya emblem in a corner, wave or seafood illustration as background overlay, vertical Japanese small-text copy column, optional time-window or promo strip
    information_density: medium-rich

  festive_campaign_brush_kv:
    when_to_use: festival-themed campaigns (winter solstice / spring festival / regional food festival), urban-culture or city-flavor campaigns, brand collaboration KV with strong typographic statement, fast-food chain regional editions
    palette:
      - vibrant base (yellow / orange / peach) with paper texture
      - oversized red or dark brush type
      - secondary mixed English serif and Chinese serif for festive mix
      - optional pink / green accent for festival motif
    background_treatment: textured paper with strong festive elements — irregular bright color block, scattered photo cutouts of regional ingredients, regional landmark line drawings, festive ornament line art, or seasonal motif pattern
    typography_emphasis: oversized handpainted brush calligraphy as the hero, often mixed with large festive serif English; rotated / tilted secondary typography; bracketed editorial copy fragments
    decoration_emphasis: multiple oval festival badges, hashtag callout labels for regional flavors, regional landmark line art, scattered photo cutouts of ingredients in baskets, mascot illustration or brand emblem with year, time-window strip
    information_density: rich

anti_ai_rules:
  - title MUST be hand-painted brush calligraphy with weathered / drybrush / signboard ink character; NEVER use clean printed Ming, modern rounded sans, cartoon childish letterforms, or thin elegant Western serif as the dominant title
  - title MUST occupy 40-60% of frame width as the visual protagonist; NEVER reduce title scale below 30% or push to supportive section header role
  - dish MUST be real photographed food in believable vessel with natural lighting; NO AI-illustrated food; NO 3D rendered dish; NO clay-like food; NO glossy plastic finish
  - dish occupies 25-40% of frame — supports the title, never exceeds it; NEVER let dish exceed 50% of frame
  - background MUST be textured paper (cream / beige / peach / orange / yellow / kraft) with optional faint watermark pattern; NEVER plain bleached white; NEVER random noise; NEVER dirty AI texture; NEVER dark feast-scene background
  - color family MUST be warm base + dark type + optional accent panel; NEVER high-saturation promo red filling the entire background; NEVER neon / fluorescent
  - decoration density MUST be medium-rich — at least 4 supporting element types (badges / brand emblem / price tag / vertical small copy / seal / watermark pattern); NEVER empty hero layout
  - mixed-language typography is encouraged (simplified + traditional + Japanese kanji + small English) — but NEVER garbled or pseudo-Chinese / pseudo-Japanese characters
  - no random AI doodle stickers floating without an info role
  - no Chinese traditional ornament excess (印章 / 卷草 / 祥云 / 花纹 dense pattern) — a single small red seal or stamp is acceptable
  - storytelling / signboard copy tone — NEVER use elegant editorial small caps style; NEVER use sale-shout buy-now splashes covering the design
  - keep brush calligraphy LEGIBLE — drybrush ink character is fine but characters must be readable Chinese (or Japanese kanji), not abstract scribble
  - no fake premium gold sparkle, no rainbow gradient, no neon backlight; warm paper-print feel only

style_dna: |
  STYLE: signboard_typography_food_poster — typography-led food poster combining oversized hand-painted brush calligraphy Chinese title as the visual protagonist (40-60% of frame width with weathered drybrush signboard ink character) with a single hero real photographed dish (bowl / plate / steamer occupying 25-40% of frame) underneath or overlapping the title, all on a textured warm paper background (cream / beige / peach / orange / yellow / kraft) with optional faint watermark pattern (ingredient silhouette / regional landmark line / wave illustration / heritage translucent watermark typography), surrounded by multiple supporting elements (oval badges / brand emblem / price tags / vertical Chinese small copy / seals / hashtag callouts) in a street-signboard tone.

  STYLE ESSENCE: typography-led signboard food poster with hand-painted brush calligraphy as protagonist. NOT a multi-dish menu array, NOT a clean editorial supportive-title layout, NOT a product-led layout with small caption, NOT a 3D rendered dish or clay food, NOT a cute cartoon mascot-led poster, NOT a sparse Japanese minimalist single-frame, NOT a heritage Chinese ornament-heavy poster, NOT a storytelling premium tea-brand zen aesthetic.

