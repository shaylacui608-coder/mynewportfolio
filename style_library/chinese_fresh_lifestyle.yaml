  ink_wash_artistic:
    when_to_use: 茶道 / 老字号品牌 / 文化品牌 / 高端文人餐饮 / 艺术联名
    palette: 水墨黑灰 + 米白宣纸 + 一抹朱红印章
    background_texture: 水墨山水淡墨 / 宣纸纹 / 兰墨笔触
    corner_decoration: 水墨山水 / 兰墨 / 竹墨 / 书法笔触 / 印章 / 砚台 / 毛笔（文人艺术调, 黑灰色为主）
