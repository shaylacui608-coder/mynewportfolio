style_name: chinese_fresh_lifestyle
style_cn: 中式清新
style_cn_full: 中式清新风（中式商业餐饮海报 · 装饰生态派）
style_type: 中式餐饮海报 / 节气菜品 KV / 门店宣传 / 套餐推广 / 品牌活动视觉

usage_scenes:
  - 中式餐饮品牌新品上市
  - 节气 / 季节菜品宣传
  - 套餐 / 菜单推广
  - 门店头图 / banner / KV
  - 老字号 / 匠心叙事
  - 火锅 / 粥品 / 烧腊 / 茶餐厅 / 中餐正餐 / 中式烘焙
  - 小红书餐饮封面
  - 节庆 / 活动 KV

mood_keywords:
  - 中式商业餐饮海报
  - 巨大书法 / 明朝体压场
  - 装饰生态系统
  - 暖色基调
  - 纹理 / 做旧底
  - 信息饱满有序
  - 烟火气
  - 传统 / 匠心
  - 节庆感
  - 文化感

one_liner: 以巨大中文书法 / 明朝体标题为视觉锚点 + 真实菜品摄影 + 围绕主体的装饰生态系统（角落植物 / 副徽章 / 印章 / 副文 / 底装饰带）+ 暖色纹理底，构建一种装饰饱满、烟火气浓、有秩序的中式商业餐饮海报。

output_ratio_options:
  banner: '4:1'
  poster: '3:4'
  square: '1:1'

style_essence:
  visual_type:
    - Chinese commercial F&B promotional poster
    - oversized Chinese typographic anchor (brush calligraphy or heavy Ming)
    - real food photography
    - ornamental ecosystem composition
  not:
    - flat graphic poster (背景必须有纹理)
    - minimalist editorial poster (必须饱满, 不能稀薄)
    - 3D rendering
    - food illustration
    - clay-like 3D
    - high-saturation promo KV
    - Western asymmetric left-text-right-image editorial layout

core_visual_logic:
  - 巨大中文标题（书法或明朝体）作为视觉锚点, 占画面 25-45% 宽度
  - 真实菜品摄影承担质感与说服力, 可单可多
  - 装饰生态系统环绕主体（角落植物 + 副徽章 + 副文 + 底装饰带 协同出现）
  - 暖色调有纹理的底统一画面, 绝不用净色
  - 信息密度中-高, 饱满有序

design_quality_logic:
  design_sense_from:
    - 巨大中文书法 / 明朝体作为视觉锚点
    - 真实菜品摄影质感
    - 底色有纹理 / 做旧 / 场景
    - 装饰生态系统协同（≥4 类协同）
    - 暖色基调 + 红色印章点缀
    - 信息密度饱满有序
  key_design_decisions:
    - 标题字号「压场」级别, 绝不普通
    - 字体用书法或明朝体, 绝不用现代无衬线
    - 底色有纹理, 绝不净色
    - 装饰要「成生态」, 不是孤立 icon
    - 真实摄影菜品, 绝不插画 / 3D
    - 居中对称为主, 编辑三段或散布为辅
    - 信息密度中-高
  hierarchy_control:
    - 第一层：巨大中文标题
    - 第二层：真实菜品摄影
    - 第三层：装饰生态（角落植物 + 副徽章 + 副文）
    - 第四层：底部信息带 / 品牌信息 / 二维码
  layout_intention:
    primary: 居中对称（标题正中 + 菜品对称分布 + 角落装饰对应）
    variant_1: 编辑三段（顶标题 / 中菜品 / 底信息）
    variant_2: 分屏（上下两块各自完整）
    variant_3: 散布（中央标题 + 周围菜品散点）
    rule: 主体永远被装饰「包围」, 不孤立
  restraint:
    - 不用扁平纯色背景
    - 不用 AI 装饰 icon（要传统印章 / 真实植物剪影 / 手工花体）
    - 不用 3D / 卡通菜品
    - 不用现代圆体 / 无衬线中文
    - 不用高饱和荧光促销色
    - 不用渐变光效 / 塑料质感
    - 装饰不「堆乱」, 要成生态
  theme_form_relationship:
    - 「传统 / 匠心」→ 做旧底纹 + 书法 + 印章 + 砂锅器皿
    - 「丰盛 / 烟火」→ 多菜品并排 + 暖色 + 装饰生态
    - 「节气 / 季节」→ 对应角落植物 + 主题色（春樱花 / 夏绿叶 / 秋松枝红叶 / 冬梅竹）
    - 「地域 / 风味」→ 场景化背景（港式店内 / 巴蜀辣椒 / 宣纸水墨 / 南洋花砖）
    - 「老字号 / 品牌力」→ 顶部品牌徽章 + 底部品牌带 + 副徽章群
  avoid_losing_design_sense:
    - 不要把底变成净色（毁底纹）
    - 不要砍掉装饰生态（变孤单）
    - 不要换成现代无衬线（毁中式气质）
    - 不要让菜品变插画 / 3D
    - 不要堆乱（装饰要分层有序）
    - 不要让信息密度太低（变成日系编辑感 = 失去中式特征）
    - 不要「左文右图」那种 Western 报刊感
  most_valuable_reusable_decision:
    - 「巨大书法标题 + 真实菜品 + 装饰生态 + 纹理底」四要素结构
    - 「角落植物 + 副徽章 + 底装饰带」的环绕装饰模式
    - 暖色基调 + 红色印章点缀的色彩配方
    - 居中对称为主、编辑三段为辅的构图选项

theme_transfer_rule:
  principle: >
    主题迁移时必须保留：巨大中文书法 / 明朝体标题、真实菜品摄影、有纹理 / 做旧 / 场景的底、
    装饰生态系统（角落植物 + 副徽章 + 副文 + 底装饰带）、暖色基调、中-高信息密度、
    居中对称为主的构图。新主题元素必须保持真实摄影质感, 不能改成插画 / 3D / 扁平图形,
    底色不能变成净色, 装饰生态不能砍光。
  object_translation_map:
    new_dish: real photographed dish in ceramic / clay / wood vessel; ideally 2 dishes for symmetric flanking
    new_season: 'corner motif — pick from seasonal pool (春 — 樱花/桃花/玉兰/迎春/海棠; 夏 — 荷花/莲叶/绣球/蕨叶/绿藤; 秋 — 菊花/红叶/桂花/柿子枝/银杏; 冬 — 梅花/松枝/山茶/竹枝) OR non-plant pool (灯笼/中国结/折扇/团扇/流苏/香炉/茶具/折纸). DO NOT default to plum blossoms regardless of season.'
    new_region: scene or pattern background — 港式店内 / 巴蜀辣椒 / 宣纸水墨 / 南洋花砖
    new_brand: top brand badge + bottom brand band + optional mascot IP
    new_festival: extra red + gold + denser decorative band
  must_keep:
    - 巨大中文书法 / 明朝体标题
    - 真实菜品摄影
    - 纹理 / 做旧 / 场景底
    - 装饰生态系统（≥4 类协同）
    - 暖色基调
    - 信息密度中-高
    - 居中对称为主
  must_not_happen:
    - 底变净色
    - 装饰被砍光
    - 用现代无衬线
    - 菜品变插画 / 3D
    - 信息密度过低
    - 左文右图非对称

variants:
