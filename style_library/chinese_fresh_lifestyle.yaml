    example_reference: 文人茶馆 / 老字号文化海报（参考图无直接对应, 新增 variant）

anti_ai_rules:
  - no flat plain-color background; background MUST be textured / aged / scene-based
  - no minimalist negative-space layout; must be a dense ornamental ecosystem
  - no AI-style food illustration; dishes MUST be real photography
  - no 3D rendered food; no clay-like 3D
  - no modern geometric sans-serif Chinese; only brush calligraphy or heavy Ming
  - no rounded bubble fonts
  - no thin elegant Western serif as the main Chinese-equivalent headline
  - no high-saturation neon promo colors
  - no gradient lighting on the dishes
  - no plastic-looking material textures
  - no isolated random AI doodle icons; decoration must form a coherent ecosystem
  - no garbled or pseudo-Chinese characters
  - no Western asymmetric left-text-right-image editorial layout
  - no documentary-style empty space
  - no symmetric layout that is EMPTY (对称必须配合装饰填充)

production_profile:
  production_template: production_templates/banner_4_1_production.yaml
  supported_outputs:
    - banner_4_1
    - poster_3_4
    - square_1_1
  default_output: banner_4_1
  title_style: oversized Chinese brush calligraphy or heavy Ming headline, 25-45% of frame width, never rounded or modern sans-serif
  subtitle_style: vertical poetic side text, framed sub-badge, small-cap English serif, or handwritten flourish
  background_style: warm textured, aged, scene-based, floral tile, kraft, rice paper, linen, brick, or wallpaper; never flat plain color
  composition_preference: centered symmetric first, with title and real dishes surrounded by a coherent ornamental ecosystem
  decoration_requirements: at least four coordinated categories from corner plant motif, sub-badge, secondary text, bottom info band, red seal stamps
  information_density: medium_high, densely populated but orderly
  anti_ai_emphasis:
    - no flat plain-color background
    - no sparse minimalist layout
    - no 3D or illustrated food
    - no modern sans-serif Chinese headline
    - no random isolated decoration

style_dna: |
  STYLE: chinese_fresh_lifestyle, Chinese commercial F&B promotional poster combining an oversized Chinese brush-calligraphy or heavy-Ming headline as the visual anchor, with real photographed dishes surrounded by a coherent ornamental ecosystem on a warm textured / aged / scene-based background.

  STYLE ESSENCE: Chinese commercial F&B poster tradition (restaurant promotion, seasonal menu, set-meal launch, brand storefront banner). NOT Western editorial minimalism, NOT Japanese / Nordic clean-restraint, NOT 3D render, NOT illustration, NOT high-saturation promo KV.

  CORE VISUAL LOGIC: an oversized Chinese title (brush calligraphy or heavy Ming) anchors the composition occupying 25-45% of the frame width; one or multiple real photographed dishes carry texture and credibility; a coherent decorative ecosystem (corner plant motif + sub-badges + secondary text + bottom info band) surrounds the main subject; a warm earth-tone or scene-textured background unifies everything; information density is medium-to-high, densely populated but orderly — NEVER sparse, NEVER empty.

  DECORATIVE ECOSYSTEM (must include at least 4 categories, choreographed not random):
  - corner motif: pick from SEASONAL POOL matching the user's title or concept (春: 樱花/桃花/玉兰/迎春/海棠; 夏: 荷花/莲叶/绣球/蕨叶; 秋: 菊花/红叶/桂花/柿子枝/银杏; 冬: 梅花/松枝/山茶/竹枝) OR from NON-PLANT POOL (灯笼/中国结/折扇/团扇/流苏/香炉/茶具/砚台) — placed at top corners (left AND right, mirrored or complementary). DO NOT default to plum blossoms regardless of season — choose the motif that matches the user's concept;
  - sub-badges: round gold-rimmed seal OR framed callout box ("seasonal new" / "premium" / "no.1") OR petal-shape badge near the title;
  - secondary text layer: vertical small-text columns (parallel poetic side lines), small-cap English serif or hand-written flourish, optional Korean / other-language support;
  - bottom decorative band: continuous small icon row / repeating seal pattern / brand info band / dotted divider with section markers;
  - traditional Chinese seal stamps: 1-3 small red stamps placed near the title or below.

  ELEMENTS: real food photography (1-N dishes, prefer 2+ for symmetric flanking), ceramic / clay / casserole / steamer / wood vessel, wooden / linen / aged-paper prop surface, red seal stamps, framed callout badges, English serif lockup, vertical poetic side text, decorative bottom band, optional brand mascot IP.

  TYPOGRAPHY: OVERSIZED Chinese brush calligraphy OR heavy Ming (宋体 / 明朝体) headline as the dominant visual anchor — must look commanding, not modest. Small Chinese serif / seal-script for secondary text. English in serif small caps or hand-written flourish. ABSOLUTELY NO rounded sans-serif, NO bubble fonts, NO modern geometric sans, NO thin elegant Western serif as the main Chinese-equivalent headline.

  COLOR: warm-earth family with red-seal accent — pick one variant:
  - warm dark red / maroon (火锅 / 节庆 / 港式)
  - kraft / aged brown (节气 / 私房菜)
  - warm beige / cream (套餐 / 中式正餐)
  - mist tea-green (清新 / 夏季)
  - ornate floral pattern (异域 / 南洋)
  Low-to-medium saturation. Always warm. No neon. No fluorescent.

  TEXTURE: background MUST be textured — aged paper, kraft, xuan rice paper, linen weave, brick wall, photo scene, ink-wash, floral tile pattern, or wallpaper print. NEVER flat plain color. Matte surfaces, natural lighting, no glossy plastic.

  INFORMATION DENSITY: medium-to-high. Orchestrated, not sparse. Dishes, title, decoration, and bottom info form a coherent populated composition.

  ANTI-AI RULES: no flat plain-color background; no Western minimalist negative-space layout; no AI-style food illustration; no 3D food; no modern Chinese sans-serif headline; no neon promo colors; no plastic textures; no isolated random AI icons; no garbled pseudo-Chinese; no Western asymmetric left-text-right-image editorial layout; no empty symmetric layout.

default_composition: |
  COMPOSITION: vertical 3:4 poster, CENTERED SYMMETRIC composition —
  - top headline band: oversized Chinese brush calligraphy or heavy Ming title centered (vertical or horizontal), flanked by small vertical secondary text columns OR a framed sub-badge (seasonal new / premium);
  - central hero band: real photographed dish(es) in ceramic / clay vessel(s), ideally 2 dishes flanking the title (one left, one right) on a textured background — or 1 central dish if only one provided;
  - corner decoration: motif at top-left AND top-right chosen from the SEASONAL POOL matching the user's concept (春: 樱花/桃花/玉兰; 夏: 荷花/莲叶/绣球; 秋: 菊花/桂花/红叶; 冬: 梅花/松枝/竹枝) OR NON-PLANT POOL (灯笼/中国结/折扇/团扇/流苏/茶具) — do NOT default to plum blossoms;
  - bottom info band: brand info / price / date / location with a thin or dotted decorative divider, optional small mascot IP and 1-3 red seal stamps.

  OUTPUT RATIO: 3:4.

final_image_prompt: |
  (auto-composed at use time = style_dna + composition for the chosen output ratio)
  For specific output formats see:
    - banner_production block (4:1 widescreen, 3840x960)
    - default_composition (3:4 vertical poster)
    - future: square_production (1:1 KV)

design_quality_checklist:
  - 标题是否使用毛笔书法或粗壮明朝体？（圆体 / 无衬线 = 不及格）
  - 标题是否压场尺寸（占画面 25-45% 宽度）？（字号偏小 = 不及格）
  - 菜品是否为真实摄影质感？（插画 / 3D = 不及格）
  - 底色是否有纹理 / 做旧 / 场景？（净色 = 不及格）
  - 是否有装饰生态（≥4 类装饰元素协同）？（孤立 icon 或装饰过少 = 不及格）
  - 角落是否有植物装饰？（左上 + 右上对应）
  - 是否有副徽章 / 印章 / 副文层？
  - 底部是否有装饰带 / 品牌信息？
  - 色调是否暖色基调？（高饱和促销色 = 不及格）
  - 信息密度是否中-高、饱满有序？（过于稀薄 = 变成日系编辑感 = 不及格）
  - 构图是否居中对称（或编辑三段）？（左文右图 = 不及格）
  - 是否避免渐变光效 / AI 装饰 / 描边花字？
  - 视觉主次：标题 → 菜品 → 装饰 → 信息 是否清晰分层？

# ============================================================
# 门店头图生产层（schema v2 扩展字段）
# 启用后, 本风格可被 scripts/assemble_banner_prompt.py 调用
# 生成 4:1 门店头图（居中对称, 一次出图）
# ============================================================
banner_production:
  enabled: true
  layout: centered_symmetric
  layout_description: >
    Banner composition (4:1 ratio): oversized Chinese brush-calligraphy or heavy
    Ming title CENTERED on a textured warm-earth background; real photographed
    dishes flanking the title — one on the LEFT side and one on the RIGHT side
    when 2 dishes are provided. Corner plant motifs at top-left and top-right.
    A framed sub-badge OR vertical secondary text accents the title. A
    decorative bottom info band runs across the lower edge. NEVER use
    asymmetric left-text-right-image layout. NEVER use flat plain-color
    background. NEVER use sparse minimalist layout.

  text_slots:
    title:
      required: true
      placement: centered horizontally, upper-center vertical
      size: oversized dominant headline (25-45% of frame width)
      style_note: must be brush calligraphy or heavy Ming; NEVER rounded or sans-serif
    subtitle:
      required: false
      placement: directly below title OR as a small framed sub-badge near the title
      size: small supporting line
      style_note: small Chinese serif, or framed callout style

  asset_slots:
    dish_images:
      required: false
      min: 0
      max: 4
      placement: flanking the centered title symmetrically
      treatment: >
        Use the user-provided dish photograph(s) as real hero subject(s).
        Keep each dish recognizable and untouched in form; integrate into the
        warm textured background with soft natural light and traditional
        ceramic / clay / casserole vessel feel. Blend the provided dish photos
        naturally into the banner background; remove rectangular photo edges and
        avoid visible cutout borders.

  decorative_ecosystem:
    required_categories_min: 4
    categories:
      - corner_plant_motif      # 角落植物 at top-left AND top-right
      - sub_badge               # 副徽章 framed callout or round gold-rimmed seal
      - secondary_text_layer    # 副文 vertical poetic side text or English serif flourish
      - bottom_info_band        # 底部装饰带 dotted divider + brand info
      - red_seal_stamps         # 红印章 1-3 stamps

  api_params:
    model: doubao-seedream-5-0-260128
    size: 3840x960
    n: 1
    # doubao-seedream-5 不支持 guidance_scale; 若回到 seedream-4-5 再加。

  dish_clauses:
    '0': 'Render two complementary hero dishes flanking the centered title — one on the LEFT and one on the RIGHT, each in a traditional ceramic / clay / casserole vessel'
    '1': 'Use the provided dish photograph as the central or left-flanking hero subject; generate one complementary companion dish on the opposite side to create symmetric balance (matching vessel and lighting). Blend the provided dish photo naturally into the banner background; remove rectangular photo edges and avoid visible cutout borders.'
    '2': 'Place the first provided dish on the LEFT side and the second on the RIGHT side, both flanking the centered title with symmetric balance. Blend the provided dish photos naturally into the banner background; remove rectangular photo edges and avoid visible cutout borders.'
    '3': 'Arrange the 3 provided dishes in a symmetric central composition around the title — typically one large central hero with two smaller flanking dishes. Blend the provided dish photos naturally into the banner background; remove rectangular photo edges and avoid visible cutout borders.'
    '4': 'Arrange the 4 provided dishes in a balanced central cluster around or below the title, maintaining symmetry and a coherent ornamental layout. Blend the provided dish photos naturally into the banner background; remove rectangular photo edges and avoid visible cutout borders.'

  prompt_assembly_template: |
    {style_dna}

    BANNER COMPOSITION: 4:1 widescreen banner, CENTERED SYMMETRIC layout.
    - Title "{title}" placed CENTERED horizontally in the upper-center of the
      frame as an OVERSIZED Chinese brush-calligraphy or heavy-Ming headline
      occupying 25-45% of the frame width. NEVER use rounded sans-serif or
      modern geometric type.
    - {subtitle_clause}
    - {dish_clause}, integrated into the warm textured background with soft
      natural light and traditional ceramic / clay / casserole vessel feel.
    - DECORATIVE ECOSYSTEM (REQUIRED, at least 4 categories, choreographed
      not random):
      • corner motifs at TOP-LEFT and TOP-RIGHT chosen from SEASONAL POOL
        matching the user's concept (春: 樱花/桃花/玉兰/迎春/海棠; 夏: 荷花/
        莲叶/绣球/蕨叶; 秋: 菊花/红叶/桂花/柿子枝/银杏; 冬: 梅花/松枝/山茶/
        竹枝) OR NON-PLANT POOL (灯笼/中国结/折扇/团扇/流苏/香炉/茶具/砚台) —
        DO NOT default to plum blossoms regardless of season; pick the motif
        that visually matches the user-provided title and variant;
      • 1-2 framed sub-badges or callout boxes near the title (e.g., "seasonal
        new" / "premium" / a round gold-rimmed seal);
      • optional vertical secondary small-text columns flanking the title
        (parallel poetic side lines);
      • 1-3 red traditional Chinese seal stamps near the title or below;
      • a decorative bottom info band with a thin or dotted divider running
        across the lower edge.
    - BACKGROUND: warm textured / aged / scene-based surface — NEVER flat
      plain color. Pick one: aged warm-red wallpaper / kraft aged brown /
      warm beige linen / mist tea-green with foliage / ornate floral tile.
    - Information density medium-to-high; orderly populated composition;
      NEVER sparse, NEVER empty.

    OUTPUT RATIO: 4:1.
