    palette: 深红 / 酒红 / 暗红 + 米白 + 红色印章
    background_texture: 做旧暗红墙纸 / 深色木纹 / 暗砖
    corner_decoration: 红灯笼 / 中国结 / 流苏 / 八角 / 红枣 / 桂圆 / 松枝（火锅节庆元素混搭, 避免梅花单一）
    typography_note: 偏粗白书法压场, 气势厚重
    example_reference: 港式打边炉 / 烈火红金 / 暖棕做旧（图1风格再加深）
  kraft_aged_brown:
    when_to_use: 节气菜品 / 私房菜 / 粥品 / 匠心叙事
    palette: 暖棕 / 卡其 / 赭石 + 红色印章
    background_texture: 做旧牛皮纸 / 篆体水印 / 砖纹
    corner_decoration: 松枝 / 红叶 / 干花
    typography_note: 粗黑明朝体或书法均可
    example_reference: 立秋·山药炖排骨（图2）/ 鲜龙骨煨（图1）
  warm_beige_creamy:
    when_to_use: 套餐推广 / 中式正餐 / 中式烘焙 / 高端品牌
