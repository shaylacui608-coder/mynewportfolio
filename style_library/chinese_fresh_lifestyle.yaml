  ornate_floral_pattern:
    when_to_use: 异域中餐 / 南洋 / 文化主题 / 品牌 IP 强的店
    palette: 花砖绿 / 红 / 金
    background_texture: 满铺花砖 / 几何纹 / 异域图案
    corner_decoration: 椰子树 / 异域植物 / 品牌 IP
    typography_note: 中文书法 + 红色英文花体叠加
    example_reference: 地道南洋风味 / 海楠里（图9 新加）

  lantern_festive_red:
    when_to_use: 春节 / 周年庆 / 婚宴 / 喜庆活动 / 老字号节日推广 / 红色主题餐饮
    palette: 大红 / 朱红 / 金 + 米白 + 黑色字
    background_texture: 红色织锦 / 红色洒金 / 暗红印花
