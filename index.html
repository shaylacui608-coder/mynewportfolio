<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lottie 平铺预览</title>
    <link rel="stylesheet" href="./styles.css?v=20260712-1716" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Lottie Preview</p>
          <h1>5 个动效平铺预览</h1>
        </div>

        <section class="control-panel" aria-label="播放控制">
          <div class="timeline-block">
            <div class="time-row">
              <span id="currentTime">0%</span>
              <span id="duration">100%</span>
            </div>
            <input id="scrubber" type="range" min="0" max="1000" value="0" step="1" aria-label="整体进度" />
          </div>

          <div class="button-row">
            <button id="restartBtn" type="button" class="icon-button" aria-label="重新播放" title="重新播放">
              <span aria-hidden="true">↺</span>
            </button>
            <button id="playBtn" type="button" class="primary-button" aria-label="暂停">
              <span id="playIcon" aria-hidden="true">Ⅱ</span>
              <span id="playText">暂停</span>
            </button>
            <button id="loopBtn" type="button" class="icon-button is-active" aria-label="循环播放" title="循环播放">
              <span aria-hidden="true">∞</span>
            </button>
          </div>

          <div class="speed-group" aria-label="播放速度">
            <button type="button" class="speed-button" data-speed="0.5">0.5x</button>
            <button type="button" class="speed-button is-active" data-speed="1">1x</button>
            <button type="button" class="speed-button" data-speed="1.5">1.5x</button>
            <button type="button" class="speed-button" data-speed="2">2x</button>
          </div>
        </section>
      </header>

      <section id="animationGrid" class="animation-grid" aria-label="Lottie 动效列表"></section>
    </main>

    <script src="./vendor/lottie.min.js"></script>
    <script src="./app.js?v=20260712-1716"></script>
  </body>
</html>
